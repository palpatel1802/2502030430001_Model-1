<!DOCTYPE html>
<html>
<head>

<title>Contact Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<form>

Submit
</button>

</form>

</div>

</body>
</html>
