<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Confirmed - MediConnect</title>

<link rel="stylesheet" href="order_confirmation.css">

<link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- LOGO -->

<div class="logo">

    <div class="logo-icon">+</div>

    <div class="logo-text">MediConnect</div>

</div>

<!-- SUCCESS CONTAINER -->

<div class="success-container">

    <!-- ICON -->

    <div class="success-icon">

        <i class="fa-solid fa-circle-check"></i>

    </div>

    <!-- TITLE -->

    <h1>Order Confirmed!</h1>

    <p class="thank-you">

        Thank you for ordering with MediConnect.

    </p>

    <!-- DESCRIPTION -->

    <div class="order-details">

        <p>
            Your medicines order has been placed successfully.
        </p>

        <p>
            Our delivery partner will contact you shortly.
        </p>

        <p>
            Estimated delivery time:
            <strong>30 - 45 Minutes</strong>
        </p>

        <p>
            Payment Method:
            <strong>Cash on Delivery</strong>
        </p>

    </div>

    <!-- BUTTONS -->

    <div class="btn-group">

        <a href="homepage.html" class="home-btn">
            Back to Home
        </a>

        <a href="medicines.html" class="shop-btn">
            Order More Medicines
        </a>

    </div>

</div>

</body>
</html>
