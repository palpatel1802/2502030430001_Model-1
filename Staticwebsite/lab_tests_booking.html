<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lab Booking - MediConnect</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

/* BODY */
body{
    background:#f5f8ff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 0 60px;
}

/* LOGO */
.logo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:30px;
}

.logo-icon{
    width:34px;
    height:34px;
    background:#2F80FF;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
    border-radius:8px;
}

.logo-text{
    font-size:26px;
    font-weight:bold;
    color:#2F80FF;
}

/* FORM CONTAINER */
.booking-box{
    width:430px;
    background:white;
    padding:35px;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    margin-bottom:40px;
}

.booking-box h1{
    color:#1d2d50;
    margin-bottom:10px;
}

.booking-box p{
    color:#6b7c93;
    margin-bottom:25px;
}

/* INPUTS */
input,
select,
textarea{
    width:100%;
    padding:14px;
    margin-bottom:16px;
    border:1px solid #dbe6ff;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2F80FF;
    box-shadow:0 0 6px rgba(47,128,255,.25);
}

textarea{
    height:100px;
    resize:none;
}

/* BUTTON */
button{
    width:100%;
    padding:14px;
    background:#2F80FF;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1f6fe5;
    transform:scale(1.02);
}

/* SUCCESS */
.success{
    display:none;
    margin-top:18px;
    padding:14px;
    background:#dff6e5;
    color:#1d7d38;
    border-radius:10px;
    text-align:center;
}

/* MOBILE */
@media(max-width:500px){

    body{
        padding:25px 0;
    }

    .booking-box{
        width:92%;
        padding:25px;
    }

    .logo-text{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="logo">
<div class="logo-icon">+</div>
<div class="logo-text">MediConnect</div>
</div>

<div class="booking-box">

<h1>Book Lab Test</h1>
<p>Schedule your test in seconds</p>

<form id="bookingForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="tel" id="mobile" maxlength="10" placeholder="Mobile Number" required>

<select required>
<option>Select Test</option>
<option>Complete Blood Count</option>
<option>Blood Sugar Test</option>
<option>Lipid Profile</option>
<option>Thyroid Test</option>
<option>Full Body Checkup</option>
</select>

<input type="date" required>

<input type="time" required>

<input type="text" placeholder="Address" required>

<textarea placeholder="Additional Notes"></textarea>

<button type="submit">Confirm Booking</button>

<div class="success">
Lab Test Booked Successfully ✓
</div>

</form>
</div>

<script>
$(document).ready(function(){

$("#mobile").on("input",function(){
this.value=this.value.replace(/[^0-9]/g,'');
});

$("#bookingForm").submit(function(e){
e.preventDefault();

let name=$("#name").val().trim();
let mobile=$("#mobile").val().trim();

let nameRegex=/^[A-Za-z ]{6,}$/;
let mobileRegex=/^[0-9]{10}$/;

if(!nameRegex.test(name)){
alert("Name must contain minimum 6 letters only");
return;
}

if(!mobileRegex.test(mobile)){
alert("Enter valid 10 digit mobile number");
return;
}

$(".success").fadeIn();

setTimeout(function(){
window.location.href="lab-tests.html";
},2500);

});

});
</script>

</body>
</html>
