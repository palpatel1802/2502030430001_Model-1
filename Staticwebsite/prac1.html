<!DOCTYPE html>
<html>

<head>
    <title>Nested List in HTML</title>
</head>

<body>
    <h2>Nested List</h2>

    <ul>
        <li>Engineering
            <ol>
                <li>Diploma</li>
                <li>B.Tech</li>
            </ol>
        </li>
        <li>Diploma
            <ol>
                <li>CE</li>
                <li>CSE</li>
                <li>IT</li>
            </ol>
        </li>
        <li>B.Tech
            <ol>
                <li>CE</li>
                <li>CSE</li>
                <li>IT</li>
            </ol>
        </li>
    </ul>
</body>

</html>
